name: Build Android APK (MBG Kitchen Monitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: ./mbg_chef_monitor
        run: flutter pub get

      - name: Build APK Release (Universal & ARM64)
        working-directory: ./mbg_chef_monitor
        run: |
          flutter build apk --release --no-tree-shake-icons
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/mbg-chef-monitor-arm64.apk

      - name: Upload APK Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mbg-kitchen-monitor-apk
          path: |
            mbg_chef_monitor/build/app/outputs/flutter-apk/app-release.apk
            mbg_chef_monitor/build/app/outputs/flutter-apk/mbg-chef-monitor-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Download APK Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            mbg_chef_monitor/build/app/outputs/flutter-apk/app-release.apk#MBG-Chef-Monitor-SPPG.apk \
            mbg_chef_monitor/build/app/outputs/flutter-apk/mbg-chef-monitor-arm64.apk \
            --clobber || \
          gh release create v1.0.0 \
            mbg_chef_monitor/build/app/outputs/flutter-apk/app-release.apk#MBG-Chef-Monitor-SPPG.apk \
            mbg_chef_monitor/build/app/outputs/flutter-apk/mbg-chef-monitor-arm64.apk \
            --title "MBG Chef Monitor v1.0.0" \
            --notes "Aplikasi Android MBG Chef Monitor (Release APK) siap pakai."
